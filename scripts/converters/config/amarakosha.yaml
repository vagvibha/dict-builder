# Configuration for converters/amarakosha_to_notes.py.
#
# Columns are looked up by their name (the HEADER:.X=<name> lines of the
# kosha record files), so order and short names don't matter. Extra
# columns are ignored. The defaults match
# vagvibha/kosha data/amarakosha; a copy of this file can live in the
# content repo and be passed with --config.

title: अमरकोषः

# Record id for a verse reference kanda.varga.shloka, e.g. 1.05.001 ->
# AK-1-05-001. Python format string over the three integers.
id_format: "AK-{0}-{1:02d}-{2:03d}"
# How a reference is shown (digits are converted to Devanagari).
display_format: "{0}।{1}।{2}"

# Cell values treated as empty (e.g. spreadsheet formula errors).
placeholder_values: ["#N/A", "TBD"]

columns:
  shlokas:                 # shlokas.txt
    ref: संख्या            # kanda.varga.shloka
    text: श्लोकः
  words:                   # words.txt
    word: प्रातिपदिकम्
    ref: संख्या            # verse the word occurs in
    order: अन्तर्संख्या    # position within the verse, e.g. 1.4
    meaning: अर्थः         # words with the same अर्थः are समानार्थकाः
    lingam: लिङ्गम्
    vachanam: वचनम्
    sudha: sudha_id        # -> sudha.txt
    kshirasvami: ks_id     # -> ks_words.txt
  sudha:                   # sudha.txt
    id: sudha_id
    text: commentary
  kshirasvami:             # ks_words.txt
    id: ks_id
    text: commentary
  vargas:                  # vargas.txt
    ref: वर्गः             # kanda.varga, e.g. 1.05
    name: varga_name       # e.g. धीवर्गः

# Shown when a word has no क्षीरस्वामी commentary.
kshirasvami_default: "॥*॥"

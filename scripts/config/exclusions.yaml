# Words excluded from shloka auto-indexing everywhere (common particles,
# pronouns, verse punctuation, etc). This is the *global* list — a book's
# own meta.yaml can add more via its own `skip:` list, and individual
# files can add more still via `HEADER:skip=...`. All three are unioned.
#
# NOTE: this list previously also contained "*", "**", "***" as tokens to
# drop, from when a single "*" was used in shlokas as an ad-hoc importance
# marker. That's superseded by the new **bold** markup, and the asterisk
# tokens have been dropped here — clean any leftover stray "*" markers in
# the source text directly rather than re-adding them here.
